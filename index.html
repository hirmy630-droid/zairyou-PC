    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap');

        .mac-btn-blue {

        /* Hover styles exclusively for devices that support hover */
        @media (hover: hover) {

<body class="flex flex-col h-screen select-none">

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const unformat = (val) => val ? val.toString().replace(/,/g, '') : '';
        const toNum = (val) => parseFloat(unformat(val)) || 0;
        const format = (val) => {
            if (val === '' || val === undefined || val === null) return '';
            const clean = unformat(val);
            const num = parseFloat(clean);
            return isNaN(num) ? val : Math.round(num).toLocaleString();
        };
        const getStored = (key, fallback) => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : fallback;
            } catch(e) { return fallback; }
        };
        const excelMod = (n, d) => d === 0 ? 0 : n - d * Math.floor(n / d);

        // 5つのアプリ（タブ）定義
        const APPS = ['calc', 'alloc', 'tightframe', 'kanamono', 'slope'];
        const APP_NAMES = {
            'calc': '役物 (板金)',
            'alloc': '材料割付',
            'tightframe': '屋根タイト',
            'kanamono': '金物割付',
            'slope': '勾配計算'
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            const paths = {
                undo: <path d="M3 7v6h6M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                rotate: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                trash: <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                x: <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                plus: <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />,
                chevron: <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                backspace: <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2zM18 9l-6 6M12 9l6 6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                copy: <path d="M8 4v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7.242a2 2 0 0 0-.602-1.43L16.083 2.57A2 2 0 0 0 14.685 2H10a2 2 0 0 0-2 2z M4 8v12a2 2 0 0 0 2 2h8" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                print: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                check: <path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" className={className} xmlns="http://www.w3.org/2000/svg">
                    {paths[name] || null}
                </svg>
            );
        };

        const RoofProfileSVG = ({ size }) => {
            if (size === '600') {
                return (
                    <svg viewBox="0 0 650 180" className="w-full h-auto max-h-[140px] text-white drop-shadow-md">
                        <line x1="40" y1="20" x2="610" y2="20" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="40" y1="15" x2="40" y2="25" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="610" y1="15" x2="610" y2="25" stroke="#8e8e93" strokeWidth="1" />
                        <text x="325" y="15" fill="#8e8e93" fontSize="14" fontWeight="bold" textAnchor="middle">600</text>
                        <line x1="40" y1="40" x2="230" y2="40" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="230" y1="40" x2="420" y2="40" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="420" y1="40" x2="610" y2="40" stroke="#8e8e93" strokeWidth="1" />
                        <text x="135" y="35" fill="#8e8e93" fontSize="14" textAnchor="middle">200</text>
                        <text x="325" y="35" fill="#8e8e93" fontSize="14" textAnchor="middle">200</text>
                        <text x="515" y="35" fill="#8e8e93" fontSize="14" textAnchor="middle">200</text>
                        <polyline points="10,80 20,50 60,50 115,140 155,140 210,50 250,50 305,140 345,140 400,50 440,50 495,140 535,140 590,50 630,50 640,80" fill="none" stroke="#f97316" strokeWidth="3" strokeLinejoin="round" />
                        <line x1="40" y1="45" x2="40" y2="80" stroke="#8e8e93" strokeWidth="1" strokeDasharray="3,3" />
                        <text x="40" y="98" fill="#8e8e93" fontSize="14" textAnchor="middle">33.5</text>
                        <text x="135" y="162" fill="#8e8e93" fontSize="14" textAnchor="middle">35</text>
                        <text x="325" y="162" fill="#8e8e93" fontSize="14" textAnchor="middle">35</text>
                        <text x="515" y="162" fill="#8e8e93" fontSize="14" textAnchor="middle">35</text>
                    </svg>
                );
            } else if (size === '500') {
                return (
                    <svg viewBox="0 0 560 220" className="w-full h-auto max-h-[140px] text-white drop-shadow-md">
                        <line x1="30" y1="20" x2="530" y2="20" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="30" y1="15" x2="30" y2="25" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="530" y1="15" x2="530" y2="25" stroke="#8e8e93" strokeWidth="1" />
                        <text x="280" y="15" fill="#8e8e93" fontSize="14" fontWeight="bold" textAnchor="middle">500</text>
                        <line x1="30" y1="200" x2="280" y2="200" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="280" y1="200" x2="530" y2="200" stroke="#8e8e93" strokeWidth="1" />
                        <text x="155" y="215" fill="#8e8e93" fontSize="14" textAnchor="middle">250</text>
                        <text x="405" y="215" fill="#8e8e93" fontSize="14" textAnchor="middle">250</text>
                        <polyline points="15,60 20,40 60,40 135,170 175,170 260,40 300,40 375,170 415,170 500,40 540,40 545,60" fill="none" stroke="#0a84ff" strokeWidth="3" strokeLinejoin="round" />
                    </svg>
                );
            } else if (size === '1000') {
                return (
                    <svg viewBox="0 0 540 220" className="w-full h-auto max-h-[140px] text-white drop-shadow-md">
                        <line x1="40" y1="20" x2="500" y2="20" stroke="#8e8e93" strokeWidth="1" />
                        <text x="270" y="15" fill="#8e8e93" fontSize="14" fontWeight="bold" textAnchor="middle">500</text>
                        <polyline points="20,70 30,50 45,50 45,70 70,70 160,190 380,190 470,70 510,70 510,50 490,50 490,80" fill="none" stroke="#30d158" strokeWidth="3" strokeLinejoin="round" />
                    </svg>
                );
            }
            return null;
        };

        function App() {
            const handleFocus = (e) => { if (e && e.target && e.target.select) e.target.select(); };
            const handleEnterKey = (e, nextRef) => { if (e.key === 'Enter') { e.preventDefault(); nextRef.current?.focus(); } };

            const [activeApp, setActiveApp] = useState(() => {
                const storedApp = localStorage.getItem('mac_activeApp') || 'calc';
                return APPS.includes(storedApp) ? storedApp : 'calc';
            });

            // Input Refs
            const calcInputRef = useRef(null);
            const allocCalcInputRef = useRef(null);
            const productNameRef = useRef(null);
            const stdLengthRef = useRef(null);
            const overlapRef = useRef(null);
            const totalDimRef = useRef(null);
            const allocLRef = useRef(null);
            const allocPitchRef = useRef(null);
            const allocCountRef = useRef(null);
            const allocWRef = useRef(null);
            const allocNoRef = useRef(null);
            const kanamonoPitchRef = useRef(null);
            const kanamonoCountRef = useRef(null);
            const kanamonoLengthRef = useRef(null);
            const tfTotalLRef = useRef(null);

            // 勾配計算用 Refs
            const slopeL1Ref = useRef(null);
            const slopeL2Ref = useRef(null);
            const slopeWRef = useRef(null);
            const slopePitchRef = useRef(null);
            const slopeCanvasRef = useRef(null);

            // States (役物・割付・タイト・金物)
            const [currentProductName, setCurrentProductName] = useState('');
            const [stdLength, setStdLength] = useState('3000');
            const [overlap, setOverlap] = useState('50');
            const [totalDim, setTotalDim] = useState('');
            const [history, setHistory] = useState(() => getStored('gradient_calc_history', []));

            const [allocL, setAllocL] = useState('');
            const [allocPitch, setAllocPitch] = useState('');
            const [allocCount, setAllocCount] = useState('');
            const [allocW, setAllocW] = useState('');
            const [allocNo, setAllocNo] = useState('');
            const [allocSource, setAllocSource] = useState(null);
            const [allocHistory, setAllocHistory] = useState(() => getStored('waritsuke_history', []));
            const [allocCalcInput, setAllocCalcInput] = useState('');

            const [kanaPitch, setKanaPitch] = useState('');
            const [kanaCount, setKanaCount] = useState('');
            const [kanaLength, setKanaLength] = useState('');

            const [tfSize, setTfSize] = useState('600');
            const [tfTotalL, setTfTotalL] = useState('');

            const [calcInput, setCalcInput] = useState('');
            const [isClearModalOpen, setIsClearModalOpen] = useState(false);
            const [toastMsg, setToastMsg] = useState('');

            // 勾配計算用 States
            const slopeStored = getStored('slope_calc_mac_state', { L1: '', L2: '', W: '', Pitch: '' });
            const [slopeL1, setSlopeL1] = useState(slopeStored.L1 || '');
            const [slopeL2, setSlopeL2] = useState(slopeStored.L2 || '');
            const [slopeW, setSlopeW] = useState(slopeStored.W || '');
            const [slopePitch, setSlopePitch] = useState(slopeStored.Pitch || '');
            const [slopeZoomImg, setSlopeZoomImg] = useState(null);

            const showToast = useCallback((msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2500);
            }, []);

            const copyToClipboard = useCallback((text, label = "計算結果") => {
                const fallbackCopy = (str) => {
                    const el = document.createElement('textarea');
                    el.value = str;
                    el.style.position = 'fixed';
                    el.style.left = '-9999px';
                    document.body.appendChild(el);
                    el.select();
                    try {
                        document.execCommand('copy');
                        showToast(`${label}をクリップボードにコピーしました`);
                    } catch (e) {
                        showToast('コピーに失敗しました');
                    }
                    document.body.removeChild(el);
                };

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(`${label}をクリップボードにコピーしました`);
                    }).catch(() => fallbackCopy(text));
                } else {
                    fallbackCopy(text);
                }
            }, [showToast]);

            // タブの記憶
            useEffect(() => {
                localStorage.setItem('mac_activeApp', activeApp);
            }, [activeApp]);

            // 勾配計算のState保存
            useEffect(() => {
                localStorage.setItem('slope_calc_mac_state', JSON.stringify({
                    L1: slopeL1, L2: slopeL2, W: slopeW, Pitch: slopePitch
                }));
            }, [slopeL1, slopeL2, slopeW, slopePitch]);

            // 役物計算
            const materialResult = useMemo(() => {
                const total = toNum(totalDim), std = toNum(stdLength), over = toNum(overlap), effective = std - over;
                if (total > 0 && effective > 0) {
                    const pieces = Math.ceil(total / effective);
                    return { pieces, remainder: (pieces * effective) - total };
                }
                return { pieces: 0, remainder: 0 };
            }, [totalDim, stdLength, overlap]);

            const calcSummaryByName = useMemo(() => {
                const summary = {};
                history.forEach(item => {
                    const key = item.name || "（品名未指定）";
                    if (!summary[key]) summary[key] = { pieces: 0, totalDistance: 0 };
                    summary[key].pieces += (item.pieces || 0);
                    summary[key].totalDistance += toNum(item.total);
                });
                return summary;
            }, [history]);

            // 材料割付計算
            const allocCalculated = useMemo(() => {
                const L = toNum(allocW), W = toNum(allocPitch), N = toNum(allocCount);
                let pitchMode = { q: '-', qRem: '-' }, countMode = { w: '-', wRem: '-' };
                if (L > 0) {
                    if (W > 0) { const q = Math.ceil(L / W); pitchMode = { q, qRem: (q * W) - L }; }
                    if (N > 0) { const w = Math.ceil(L / N); countMode = { w, wRem: (w * N) - L }; }
                }
                return { pitchMode, countMode };
            }, [allocW, allocPitch, allocCount]);

            const allocSummaryByMemo = useMemo(() => {
                const summary = {};
                allocHistory.forEach(item => {
                    const key = item.no || "（備考なし）";
                    if (!summary[key]) summary[key] = { pitch: 0, count: 0 };
                    const qVal = parseInt(unformat(item.q)) || 0;
                    if (item.source === 'pitch') summary[key].pitch += qVal;
                    else if (item.source === 'count') summary[key].count += qVal;
                });
                return summary;
            }, [allocHistory]);

            // 金物割付計算
            const kanamonoResults = useMemo(() => {
                const L = toNum(kanaLength), W = toNum(kanaPitch), N = toNum(kanaCount);
                let resQ = { val: '-', rem: '-' }, resW = { val: '-', rem: '-' };
                if (L > 0) {
                    if (W > 0) { const q = Math.floor(L / W) + 1; resQ = { val: q, rem: L - (W * (q - 1)) }; }
                    if (N > 1) { const w = Math.floor(L / (N - 1)); resW = { val: w, rem: L - (w * (N - 1)) }; }
                    else if (N === 1) resW = { val: 0, rem: L };
                }
                return { resQ, resW };
            }, [kanaLength, kanaPitch, kanaCount]);

            const kanamonoTableData = useMemo(() => {
                const { resQ, resW } = kanamonoResults, L = toNum(kanaLength), W = toNum(kanaPitch), N = toNum(kanaCount);
                const listQ = [], listN = [];
                if (L > 0 && W > 0 && resQ.val !== '-') { let pos = resQ.rem / 2; for (let i = 0; i < resQ.val; i++) { listQ.push(Math.round(pos)); pos += W; } }
                if (L > 0 && N > 0 && resW.val !== '-') { let pos = resW.rem / 2; for (let i = 0; i < N; i++) { listN.push(Math.round(pos)); pos += resW.val; } }
                const maxRows = Math.max(listQ.length, listN.length), rows = [];
                for (let i = 0; i < maxRows; i++) rows.push({ q: listQ[i], n: listN[i] });
                return rows;
            }, [kanaLength, kanaPitch, kanaCount, kanamonoResults]);

            // タイトフレーム計算
            const tfResults = useMemo(() => {
                const size = parseInt(tfSize) || 600; const L = toNum(tfTotalL); let yamaDim = 0, taniDim = 0, calcSize = size;
                if (size === 600) { yamaDim = 200; taniDim = 100; calcSize = 600; }
                else if (size === 500) { yamaDim = 250; taniDim = 125; calcSize = 500; }
                else if (size === 1000) { yamaDim = 500; taniDim = 250; calcSize = 500; }
                if (L <= 0) return { centerL: '', yamaDim, taniDim, taniZan: '', yamaZan: '', table: [], count: 0, roofTaniCount: '', roofYamaCount: '', L: 0 };
                const centerL = L / 2, taniZan = excelMod(centerL, yamaDim), yamaZan = excelMod(centerL - taniDim, yamaDim);
                let currentTani = taniZan, currentYama = yamaZan, table = [], count = 0;
                while (currentTani <= L || currentYama <= L) {
                    table.push({ tani: (currentTani <= L && currentTani >= 0) ? currentTani : null, yama: (currentYama <= L && currentYama >= 0) ? currentYama : null });
                    currentTani += size; currentYama += size; count++; if (count > 1000) break;
                }
                const roofTaniCount = Math.ceil((L + taniDim) / calcSize), roofYamaCount = Math.ceil(L / calcSize);
                return { centerL, yamaDim, taniDim, taniZan, yamaZan, table, count, roofTaniCount, roofYamaCount, L };
            }, [tfSize, tfTotalL]);

            // 勾配計算ロジック
            const slopeCalculated = useMemo(() => {
                const a = toNum(slopeL1);
                const c = toNum(slopeL2);
                const b = toNum(slopeW);
                const interval = toNum(slopePitch);

                if (b <= 0 || interval <= 0) {
                    return { isValid: false, count: 0, newB: 0, newC: 0, step: 0, table: [], scrapW: 0, scrapL: 0, a, b, c, interval };
                }

                const count = Math.ceil(b / interval);
                const newB = count * interval;
                const slope = (c - a) / b;
                const newC = a + (slope * newB);
                const step = slope * interval;

                const table = [];
                for (let i = 0; i <= count; i++) {
                    const dist = i * interval;
                    const height = a + (slope * dist);
                    table.push({ no: i, dist, height });
                }

                const scrapW = newB - b;
                const scrapL = newC - c;

                return {
                    isValid: true, count, newB, newC, step, table, scrapW, scrapL, a, b, c, interval
                };
            }, [slopeL1, slopeL2, slopeW, slopePitch]);

            // 勾配 Canvas描画関数
            const drawSlopeCanvas = useCallback(() => {
                const canvas = slopeCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const container = canvas.parentElement;
                if (!container) return;
                const rect = container.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;

                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                ctx.clearRect(0, 0, rect.width, rect.height);

                const { isValid, a, b: origB, c: origC, newB, newC, count, interval } = slopeCalculated;
                if (!isValid) return;

                const padding = { l: 45, r: 45, t: 35, b: 45 };
                const drawW = rect.width - (padding.l + padding.r);
                const drawH = rect.height - (padding.t + padding.b);
                const scaleX = drawW / (newB || 1);
                const maxHeight = Math.max(a, newC, origC);
                const scaleY = drawH / (maxHeight || 1);

                const tx = (x) => padding.l + x * scaleX;
                const ty = (y) => rect.height - padding.b - y * scaleY;

                // 背景グリッド
                ctx.beginPath();
                ctx.strokeStyle = '#222226';
                ctx.lineWidth = 1;
                for (let j = 0; j <= maxHeight; j += (maxHeight / 4 || 1)) {
                    if (j === 0) continue;
                    ctx.moveTo(tx(0), ty(j));
                    ctx.lineTo(tx(newB), ty(j));
                }
                ctx.stroke();

                // 底辺
                ctx.beginPath();
                ctx.strokeStyle = '#0a84ff';
                ctx.lineWidth = 2;
                ctx.moveTo(tx(0), ty(0));
                ctx.lineTo(tx(newB), ty(0));
                ctx.stroke();

                // ピッチ線
                for (let i = 1; i < count; i++) {
                    const cx = i * interval;
                    const cy = a + ((newC - a) / newB) * cx;
                    ctx.beginPath();
                    ctx.strokeStyle = '#bf5af2';
                    ctx.lineWidth = 1;
                    ctx.globalAlpha = 0.4;
                    ctx.moveTo(tx(cx), ty(0));
                    ctx.lineTo(tx(cx), ty(cy));
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }

                // 元寸法ライン（破線）
                if (origB > 0 && origB !== newB) {
                    ctx.setLineDash([4, 3]);
                    ctx.strokeStyle = '#ff453a';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(tx(origB), ty(0));
                    ctx.lineTo(tx(origB), ty(origC));
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.font = "bold 14px -apple-system, sans-serif";
                    ctx.fillStyle = "#ff453a";
                    ctx.textAlign = "center";
                    ctx.fillText(`実寸L2: ${Math.round(origC)}`, tx(origB), ty(0) + 20);
                }

                // 基準側(L1)・延長側(L2)の垂直線
                ctx.beginPath();
                ctx.strokeStyle = '#30d158';
                ctx.lineWidth = 2.5;
                ctx.moveTo(tx(0), ty(0));
                ctx.lineTo(tx(0), ty(a));
                ctx.stroke();

                ctx.beginPath();
                ctx.strokeStyle = '#30d158';
                ctx.lineWidth = 2.5;
                ctx.moveTo(tx(newB), ty(0));
                ctx.lineTo(tx(newB), ty(newC));
                ctx.stroke();

                // 斜辺 (屋根勾配面)
                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.moveTo(tx(0), ty(a));
                ctx.lineTo(tx(newB), ty(newC));
                ctx.stroke();

                // 数値ラベル
                ctx.font = "bold 14px -apple-system, sans-serif";
                ctx.fillStyle = "#30d158";
                ctx.textAlign = "center";
                ctx.fillText(`L1: ${Math.round(a)}`, tx(0), ty(a) - 10);
                ctx.fillText(`延長L2: ${Math.round(newC)}`, tx(newB), ty(newC) - 10);

                ctx.fillStyle = "#0a84ff";
                ctx.fillText(`W(設計): ${Math.round(origB)}`, tx(origB / 2), ty(0) + 20);

                if (origB !== newB && newB > 0) {
                    ctx.fillStyle = "#8e8e93";
                    ctx.font = "bold 14px -apple-system, sans-serif";
                    ctx.fillText(`全体幅: ${Math.round(newB)} (端材 ${Math.round(newB - origB)})`, tx(newB / 2), ty(0) + 36);
                }
            }, [slopeCalculated]);

            useEffect(() => {
                if (activeApp === 'slope') {
                    // 少し遅延させて確実に親コンテナサイズを取得
                    const timer = setTimeout(drawSlopeCanvas, 50);
                    window.addEventListener('resize', drawSlopeCanvas);
                    return () => {

            // 勾配計算結果テキストのコピー
            const copySlopeResults = () => {

                const { a, origB, origC, interval, newB, newC, count, step, table } = slopeCalculated;

                    '【勾配 寸法計算結果】',

                    `全体の幅 W: ${toNum(slopeW)} mm`,

                    `総枚数: ${count} 枚`,
                    `増分 (1枚あたり): ${Math.round(Math.abs(step)).toLocaleString()} mm`,
                    '------------------------',
                    '【寸法詳細】'
                ];
                table.forEach(r => {
                    lines.push(`No.${r.no} | 働き幅: ${Math.round(r.dist).toLocaleString()} mm | 長さ: ${Math.round(r.height).toLocaleString()} mm`);
                });
                lines.push(`端材 | 働き端材: ${Math.round(slopeCalculated.scrapW).toLocaleString()} mm | 長さ端材: ${Math.round(slopeCalculated.scrapL).toLocaleString()} mm`);

                copyToClipboard(lines.join('
'), '勾配寸法計算結果');
            };

            const resetSlopeInputs = () => {
                setSlopeL1('');
                setSlopeL2('');
                setSlopeW('');
                setSlopePitch('');
                showToast('勾配の入力をクリアしました');
            };

            const openSlopeZoomModal = () => {
                const canvas = slopeCanvasRef.current;
                if (!canvas || canvas.width === 0) return;
                setSlopeZoomImg(canvas.toDataURL('image/png'));
            };

            const addValue = () => {

                if (val > 0) {

                    setTimeout(() => calcInputRef.current?.focus(), 50);

            const addAllocValue = () => {

            };

            const saveToHistoryManually = () => {
                if (toNum(totalDim) === 0) return;
                const newHistory = [{
                    id: Date.now().toString(), name: currentProductName, total: totalDim,
                    std: stdLength, overlap: overlap, pieces: materialResult.pieces,

            const saveAllocHistory = () => {

                let entry = { id: Date.now().toString(), L: format(allocW), memoL: allocL, no: allocNo, source: allocSource };
                if (allocSource === 'pitch') entry = { ...entry, pitch: format(allocPitch), q: allocCalculated.pitchMode.q, rem: format(allocCalculated.pitchMode.qRem) };
                else entry = { ...entry, count: allocCalculated.countMode.w, q: format(allocCount), rem: format(allocCalculated.countMode.wRem) };

                showToast('材料割付の履歴を保存しました');
            };

            // キーボードショートカット (⌘1〜⌘5、⌘S、Esc)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
                    const cmdKey = isMac ? e.metaKey : e.ctrlKey;

                            e.preventDefault();
                            if (activeApp === 'calc') saveToHistoryManually();
                            else if (activeApp === 'alloc') saveAllocHistory();
                            else if (activeApp === 'slope') copySlopeResults();
                            return;
                        }
                        // ⌘P: Native print
                        if (e.key.toLowerCase() === 'p') {
                            return;
                        }
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [activeApp, totalDim, currentProductName, stdLength, overlap, materialResult, allocW, allocSource, allocPitch, allocCount, allocCalculated, slopeCalculated, slopeZoomImg, isClearModalOpen]);

            return (
                <div className="flex flex-col h-full bg-[#121214] text-zinc-100 overflow-hidden">
                    {toastMsg && (
                        <div className="fixed top-12 left-1/2 -translate-x-1/2 z-[300] bg-zinc-800/90 text-white px-4 py-2 rounded-full border border-zinc-700/80 shadow-2xl flex items-center gap-2 backdrop-blur-md text-xs font-semibold animate-fade-in">
                            <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                            {toastMsg}
                        </div>
                    )}

                    {/* macOS Title Bar & Unified Segmented Controls */}
                    <header className="h-13 px-4 border-b border-white/10 bg-[#1c1c1e]/80 backdrop-blur-xl flex items-center justify-between shrink-0 z-40 select-none">
                        <div className="flex items-center gap-4">
                            {/* Mac Traffic Light Accent Buttons */}
                            <div className="flex items-center gap-2 px-1">
                                <span className="w-3 h-3 rounded-full bg-[#ff5f56] border border-[#e0443e]"></span>
                                <span className="w-3 h-3 rounded-full bg-[#ffbd2e] border border-[#dea123]"></span>
                                <span className="w-3 h-3 rounded-full bg-[#27c93f] border border-[#1aab29]"></span>
                            </div>
                            <div className="h-4 w-[1px] bg-white/10 mx-1"></div>
                            <h1 className="text-xs font-bold uppercase tracking-wider text-zinc-300 font-mono flex items-center gap-1.5">
                                KYOWA ROOF <span className="text-[10px] text-zinc-500 font-normal">macOS Ver</span>
                            </h1>
                        </div>

                        {/* macOS Segmented Tab Navigation with Shortcuts (⌘1〜⌘5) */}

                                <button

                                    className={`px-3 py-1 rounded-md text-xs font-bold transition-all flex items-center gap-1.5 ${activeApp === app ? 'bg-[#2c2c2e] text-white shadow-sm border border-white/10' : 'text-zinc-400 hover:text-zinc-200'}`}
                                >
                                    <span>{APP_NAMES[app]}</span>

                                </button>
                            ))}
                        </div>

                        <div className="flex items-center gap-2">
                            {activeApp === 'slope' && (
                                <button onClick={copySlopeResults} className="mac-btn mac-btn-blue !py-1 !px-2.5 text-xs text-white gap-1.5" title="結果をクリップボードにコピー">
                                    <Icon name="copy" size={14} /> 結果コピー

                            <button onClick={() => window.print()} className="mac-btn !py-1 !px-2.5 text-xs text-zinc-300 gap-1.5" title="印刷 / PDF保存 (⌘P)">
                                <Icon name="print" size={14} /> 印刷
                            </button>

                    </header>

                    {/* Main Workspace Area */}
                    <main className="flex-1 p-5 overflow-hidden">
                        <div className="h-full w-full max-w-[1500px] mx-auto">

                                    <div className="col-span-5 flex flex-col gap-4 overflow-y-auto pr-1">

                                            <div className="grid grid-cols-2 gap-3">

                                                    <input ref={stdLengthRef} type="text" value={format(stdLength)} onFocus={handleFocus} onChange={(e) => setStdLength(unformat(e.target.value))} onKeyDown={(e) => handleEnterKey(e, overlapRef)} className="mac-input w-full" placeholder="3000" />

                                                    <input ref={overlapRef} type="text" value={format(overlap)} onFocus={handleFocus} onChange={(e) => setOverlap(unformat(e.target.value))} onKeyDown={(e) => handleEnterKey(e, totalDimRef)} className="mac-input w-full" placeholder="50" />

                                                    {totalDim && <button onClick={() => setTotalDim('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300"><Icon name="x" size={16} /></button>}

                                                <div className="bg-[#121214] border border-[#2c2c2e] rounded-lg p-2.5 focus-within:border-[#bf5af2] transition-all">
                                                    <div className="flex justify-between items-center mb-1 select-none">
                                                        <label className="text-xs font-bold text-[#bf5af2]">働き幅 ＠ (mm)</label>
                                                        {slopePitch && <button onClick={() => setSlopePitch('')} className="text-[10px] text-zinc-500 hover:text-zinc-300">消去</button>}
                                                    </div>
                                                    <input ref={slopePitchRef} type="number" step="any" min="0" placeholder="0" value={slopePitch} onFocus={handleFocus} onChange={(e) => setSlopePitch(e.target.value)} className="w-full bg-transparent text-xl font-bold font-mono text-white text-right focus:outline-none" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* 計算結果サマリー */}
                                        <div className="grid grid-cols-4 gap-3 select-none">
                                            <div className="mac-card p-3 text-center border-b-2 border-b-[#0a84ff]">
                                                <span className="block text-[11px] font-bold text-[#0a84ff] mb-1">延長後の幅</span>
                                                <span className="text-xl font-mono font-bold text-white">{slopeCalculated.isValid ? Math.round(slopeCalculated.newB).toLocaleString() : '-'}</span>
                                            </div>
                                            <div className="mac-card p-3 text-center border-b-2 border-b-[#30d158]">
                                                <span className="block text-[11px] font-bold text-[#30d158] mb-1">延長後のL2</span>
                                                <span className="text-xl font-mono font-bold text-white">{slopeCalculated.isValid ? Math.round(slopeCalculated.newC).toLocaleString() : '-'}</span>
                                            </div>
                                            <div className="mac-card p-3 text-center border-b-2 border-b-[#f97316]">
                                                <span className="block text-[11px] font-bold text-[#f97316] mb-1">総枚数</span>
                                                <span className="text-xl font-mono font-bold text-white">{slopeCalculated.isValid ? `${slopeCalculated.count}枚` : '-'}</span>
                                            </div>
                                            <div className="mac-card p-3 text-center border-b-2 border-b-[#bf5af2]">
                                                <span className="block text-[11px] font-bold text-[#bf5af2] mb-1">増分 (1枚あたり)</span>
                                                <span className="text-xl font-mono font-bold text-white">{slopeCalculated.isValid ? Math.round(Math.abs(slopeCalculated.step)).toLocaleString() : '-'}</span>
                                            </div>
                                        </div>

                                        {/* 勾配 断面形状図 Canvas */}
                                        <div className="mac-card p-4 flex flex-col select-none">
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">勾配 断面形状図</span>
                                                <span className="text-[11px] text-zinc-500">クリックで拡大プレビュー</span>
                                            </div>
                                            <div className="w-full bg-[#121214] border border-[#2c2c2e] rounded-lg aspect-[16/9] overflow-hidden cursor-pointer relative" onClick={openSlopeZoomModal}>
                                                <canvas ref={slopeCanvasRef} className="w-full h-full block"></canvas>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 右側：各ピッチ寸法詳細テーブル */}
                                    <div className="col-span-5 mac-card flex flex-col overflow-hidden h-full select-none">
                                        <div className="p-3 border-b border-zinc-800 flex justify-between items-center bg-zinc-900/60 shrink-0">
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs font-bold text-zinc-300 uppercase tracking-wider">各ピッチ寸法詳細</span>
                                                <span className="text-xs font-mono font-bold text-orange-400 bg-orange-500/10 px-2 py-0.5 rounded border border-orange-500/20">{slopeCalculated.isValid ? `${slopeCalculated.count}枚` : '0枚'}</span>
                                            </div>
                                            <span className="text-xs text-zinc-500 font-mono">単位: mm</span>
                                        </div>

                                        <div className="flex-1 overflow-y-auto">
                                            <table className="result-table w-full border-collapse bg-[#121214] text-sm">
                                                <thead className="sticky top-0 bg-[#242426] z-10 font-mono text-xs">
                                                    <tr>
                                                        <th className="w-14 text-orange-400 py-2.5 font-bold">No.</th>
                                                        <th className="text-blue-400 py-2.5 font-bold">働き幅累計</th>
                                                        <th className="text-emerald-400 py-2.5 font-bold">屋根長さ</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="font-mono text-sm">
                                                    {!slopeCalculated.isValid ? (
                                                        <tr><td colSpan="3" className="py-24 text-center text-zinc-600 font-bold">数値を入力すると寸法表が表示されます</td></tr>
                                                    ) : (
                                                        <>
                                                            {slopeCalculated.table.map(row => {
                                                                const isStart = (row.no === 0);
                                                                return (
                                                                    <tr key={row.no} className="hover:bg-zinc-800/40 transition-colors">
                                                                        <td className="text-center font-bold text-orange-400 py-2">{row.no}</td>
                                                                        <td className={`text-center font-semibold py-2 ${isStart ? 'text-zinc-500' : 'text-blue-400'}`}>{Math.round(row.dist).toLocaleString()}</td>
                                                                        <td className={`text-center font-bold text-base py-2 ${isStart ? 'text-zinc-500' : 'text-emerald-400'}`}>{Math.round(row.height).toLocaleString()}</td>
                                                                    </tr>
                                                                );
                                                            })}
                                                            <tr className="bg-[#242426]">
                                                                <td className="text-center font-bold text-zinc-400 py-2 text-xs">端材</td>
                                                                <td className="text-center text-blue-400 py-2">
                                                                    <span className="text-[10px] text-zinc-400 block font-sans">働き端材</span>
                                                                    <span className="font-bold">{Math.round(slopeCalculated.scrapW).toLocaleString()}</span>
                                                                </td>
                                                                <td className="text-center text-emerald-400 py-2">
                                                                    <span className="text-[10px] text-zinc-400 block font-sans">長さ端材</span>
                                                                    <span className="font-bold text-base">{Math.round(slopeCalculated.scrapL).toLocaleString()}</span>
                                                                </td>
                                                            </tr>
                                                        </>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* 勾配 Canvas 拡大プレビュー用モーダル */}
                    {slopeZoomImg && (
                        <div className="fixed inset-0 z-[250] flex items-center justify-center bg-black/85 backdrop-blur-md p-6 select-none" onClick={() => setSlopeZoomImg(null)}>
                            <div className="relative max-w-5xl w-full max-h-[90vh] mac-card p-4 flex flex-col shadow-2xl border border-white/20 animate-fade-in" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-xs font-bold text-white uppercase tracking-wider">勾配 断面形状図 拡大プレビュー</span>
                                    <button onClick={() => setSlopeZoomImg(null)} className="mac-btn !py-1 !px-2.5 text-xs text-zinc-400 hover:text-white">閉じる (Esc)</button>
                                </div>
                                <div className="flex-1 flex items-center justify-center overflow-hidden">
                                    <img src={slopeZoomImg} className="max-w-full max-h-[75vh] object-contain rounded-lg" alt="拡大プレビュー" />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Clear Confirmation Modal */}
                    {isClearModalOpen && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm px-4 select-none">
                            <div className="mac-card p-6 w-80 text-center space-y-4 shadow-2xl border border-white/20 animate-fade-in">
                                <h3 className="text-sm font-bold text-white">履歴の全削除</h3>
                                <p className="text-xs text-zinc-400">すべての計算履歴を消去します。<br/>この操作は元に戻せません。</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setIsClearModalOpen(false)} className="flex-1 mac-btn text-xs">キャンセル</button>
                                    <button onClick={() => {
                                        if (activeApp === 'alloc') { setAllocHistory([]); localStorage.removeItem('waritsuke_history'); }
                                        else if (activeApp === 'calc') { setHistory([]); localStorage.removeItem('gradient_calc_history'); }
                                        setIsClearModalOpen(false);
                                        showToast('履歴を削除しました');
                                    }} className="flex-1 mac-btn mac-btn-red text-xs">削除する</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        // PWAのアップデート検知と自動リロード
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v={version_string}').then((registration) => {
                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        if (!installingWorker) return;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // 新しいバージョンがインストールされたら古いSWを強制スキップ
                                installingWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        };
                    };
                }).catch((err) => {});
                
                // コントローラーが切り替わった（新しいバージョンがアクティブになった）らリロード
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        window.location.reload();
                        refreshing = true;
                    }
                });
            });
        }
    </script>
</body>
</html>
