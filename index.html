<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>材料取り 計算 for Mac</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mac: {
                            base: '#161618',
                            sidebar: '#1c1c1e',
                            card: '#242426',
                            cardHover: '#2c2c2e',
                            input: '#121214',
                            border: '#38383a',
                            borderLight: '#48484a',
                            accent: '#0a84ff',
                            orange: '#f97316',
                            green: '#30d158',
                            purple: '#bf5af2',
                            red: '#ff453a'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap');

        :root {
            --mac-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
            --mac-mono: "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea, [contenteditable="true"] {
            user-select: text;
            -webkit-user-select: text;
        }

        body {
            font-family: var(--mac-font);
            background-color: #121214;
            color: #f5f5f7;
            height: 100vh;
            overflow: hidden;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* macOS Custom Thin Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border-radius: 9999px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.32);
            border: 2px solid transparent;
            background-clip: content-box;
        }

        /* macOS Control Button Style */
        .mac-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .mac-btn:hover {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-0.5px);
        }
        .mac-btn:active {
            transform: translateY(1px);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.04);
        }

        .mac-btn-primary {
            background: linear-gradient(180deg, #f97316 0%, #ea580c 100%) !important;
            border-color: rgba(255, 255, 255, 0.25) !important;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(234, 88, 12, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
        .mac-btn-primary:hover {
            background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%) !important;
            box-shadow: 0 3px 8px rgba(234, 88, 12, 0.5);
        }

        .mac-btn-blue {
            background: linear-gradient(180deg, #0a84ff 0%, #0066cc 100%) !important;
            border-color: rgba(255, 255, 255, 0.25) !important;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(10, 132, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
        .mac-btn-blue:hover {
            background: linear-gradient(180deg, #2b95ff 0%, #0066cc 100%) !important;
        }

        .mac-btn-red {
            background: linear-gradient(180deg, #dc2626 0%, #b91c1c 100%) !important;
            border-color: rgba(255, 255, 255, 0.25) !important;
            color: #ffffff;
        }

        /* macOS Modern Card */
        .mac-card {
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(20px);
        }

        /* High Precision Monospace Number Fields */
        .mac-input {
            font-family: var(--mac-mono);
            background: #121214;
            border: 1px solid #38383a;
            color: #ffffff;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.15s ease;
        }
        .mac-input:focus {
            border-color: #0a84ff;
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
            background: #18181b;
        }

        /* Keyboard Shortcut Badges (macOS style) */
        .kbd-badge {
            font-family: var(--mac-mono);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            color: #a1a1aa;
            line-height: 1;
        }

        /* Print styles for Mac cmd+P output */
        @media print {
            body {
                background: white !important;
                color: black !important;
                overflow: visible !important;
                height: auto !important;
            }
            header, nav, button, .no-print {
                display: none !important;
            }
            .mac-card {
                background: white !important;
                border: 1px solid #ccc !important;
                color: black !important;
                box-shadow: none !important;
            }
            table, th, td {
                color: black !important;
                border-color: #ddd !important;
            }
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none">
    <div id="root" class="flex flex-col flex-1 h-full overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const unformat = (val) => val ? val.toString().replace(/,/g, '') : '';
        const toNum = (val) => parseFloat(unformat(val)) || 0;
        const format = (val) => {
            if (val === '' || val === undefined || val === null) return '';
            const clean = unformat(val);
            const num = parseFloat(clean);
            return isNaN(num) ? val : Math.round(num).toLocaleString();
        };
        const getStored = (key, fallback) => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : fallback;
            } catch(e) { return fallback; }
        };
        const excelMod = (n, d) => d === 0 ? 0 : n - d * Math.floor(n / d);

        const APPS = ['calc', 'alloc', 'tightframe', 'kanamono'];
        const APP_NAMES = {
            'calc': '役物 (板金)',
            'alloc': '材料割付',
            'tightframe': '屋根タイト',
            'kanamono': '金物割付'
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            const paths = {
                undo: <path d="M3 7v6h6M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                rotate: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                trash: <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                x: <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                plus: <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />,
                chevron: <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                backspace: <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2zM18 9l-6 6M12 9l6 6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                copy: <path d="M8 4v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7.242a2 2 0 0 0-.602-1.43L16.083 2.57A2 2 0 0 0 14.685 2H10a2 2 0 0 0-2 2z M4 8v12a2 2 0 0 0 2 2h8" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                print: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
                check: <path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" className={className} xmlns="http://www.w3.org/2000/svg">
                    {paths[name] || null}
                </svg>
            );
        };

        const RoofProfileSVG = ({ size }) => {
            if (size === '600') {
                return (
                    <svg viewBox="0 0 650 180" className="w-full h-auto max-h-[140px] text-white drop-shadow-md">
                        <line x1="40" y1="20" x2="610" y2="20" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="40" y1="15" x2="40" y2="25" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="610" y1="15" x2="610" y2="25" stroke="#8e8e93" strokeWidth="1" />
                        <text x="325" y="15" fill="#8e8e93" fontSize="13" fontWeight="bold" textAnchor="middle">600</text>
                        <line x1="40" y1="40" x2="230" y2="40" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="230" y1="40" x2="420" y2="40" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="420" y1="40" x2="610" y2="40" stroke="#8e8e93" strokeWidth="1" />
                        <text x="135" y="35" fill="#8e8e93" fontSize="11" textAnchor="middle">200</text>
                        <text x="325" y="35" fill="#8e8e93" fontSize="11" textAnchor="middle">200</text>
                        <text x="515" y="35" fill="#8e8e93" fontSize="11" textAnchor="middle">200</text>
                        <polyline points="10,80 20,50 60,50 115,140 155,140 210,50 250,50 305,140 345,140 400,50 440,50 495,140 535,140 590,50 630,50 640,80" fill="none" stroke="#f97316" strokeWidth="3" strokeLinejoin="round" />
                        <line x1="40" y1="45" x2="40" y2="80" stroke="#8e8e93" strokeWidth="1" strokeDasharray="3,3" />
                        <text x="40" y="95" fill="#8e8e93" fontSize="11" textAnchor="middle">33.5</text>
                        <text x="135" y="160" fill="#8e8e93" fontSize="11" textAnchor="middle">35</text>
                        <text x="325" y="160" fill="#8e8e93" fontSize="11" textAnchor="middle">35</text>
                        <text x="515" y="160" fill="#8e8e93" fontSize="11" textAnchor="middle">35</text>
                    </svg>
                );
            } else if (size === '500') {
                return (
                    <svg viewBox="0 0 560 220" className="w-full h-auto max-h-[140px] text-white drop-shadow-md">
                        <line x1="30" y1="20" x2="530" y2="20" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="30" y1="15" x2="30" y2="25" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="530" y1="15" x2="530" y2="25" stroke="#8e8e93" strokeWidth="1" />
                        <text x="280" y="15" fill="#8e8e93" fontSize="13" fontWeight="bold" textAnchor="middle">500</text>
                        <line x1="30" y1="200" x2="280" y2="200" stroke="#8e8e93" strokeWidth="1" />
                        <line x1="280" y1="200" x2="530" y2="200" stroke="#8e8e93" strokeWidth="1" />
                        <text x="155" y="215" fill="#8e8e93" fontSize="11" textAnchor="middle">250</text>
                        <text x="405" y="215" fill="#8e8e93" fontSize="11" textAnchor="middle">250</text>
                        <polyline points="15,60 20,40 60,40 135,170 175,170 260,40 300,40 375,170 415,170 500,40 540,40 545,60" fill="none" stroke="#0a84ff" strokeWidth="3" strokeLinejoin="round" />
                    </svg>
                );
            } else if (size === '1000') {
                return (
                    <svg viewBox="0 0 540 220" className="w-full h-auto max-h-[140px] text-white drop-shadow-md">
                        <line x1="40" y1="20" x2="500" y2="20" stroke="#8e8e93" strokeWidth="1" />
                        <text x="270" y="15" fill="#8e8e93" fontSize="13" fontWeight="bold" textAnchor="middle">500</text>
                        <polyline points="20,70 30,50 45,50 45,70 70,70 160,190 380,190 470,70 510,70 510,50 490,50 490,80" fill="none" stroke="#30d158" strokeWidth="3" strokeLinejoin="round" />
                    </svg>
                );
            }
            return null;
        };

        function App() {
            const handleFocus = (e) => { if (e && e.target && e.target.select) e.target.select(); };
            const handleEnterKey = (e, nextRef) => { if (e.key === 'Enter') { e.preventDefault(); nextRef.current?.focus(); } };

            const [activeApp, setActiveApp] = useState(() => {
                const storedApp = localStorage.getItem('mac_activeApp') || 'calc';
                return APPS.includes(storedApp) ? storedApp : 'calc';
            });

            // Input Refs
            const calcInputRef = useRef(null);
            const allocCalcInputRef = useRef(null);
            const productNameRef = useRef(null);
            const stdLengthRef = useRef(null);
            const overlapRef = useRef(null);
            const totalDimRef = useRef(null);
            const allocLRef = useRef(null);
            const allocPitchRef = useRef(null);
            const allocCountRef = useRef(null);
            const allocWRef = useRef(null);
            const allocNoRef = useRef(null);
            const kanamonoPitchRef = useRef(null);
            const kanamonoCountRef = useRef(null);
            const kanamonoLengthRef = useRef(null);
            const tfTotalLRef = useRef(null);

            // States
            const [currentProductName, setCurrentProductName] = useState(() => localStorage.getItem('productName') || '');
            const [stdLength, setStdLength] = useState(() => localStorage.getItem('stdLength') || '3000');
            const [overlap, setOverlap] = useState(() => localStorage.getItem('overlap') || '50');
            const [totalDim, setTotalDim] = useState(() => localStorage.getItem('totalDim') || '');
            const [cumulativeSum, setCumulativeSum] = useState(() => toNum(localStorage.getItem('cumulativeSum') || 0));
            const [history, setHistory] = useState(() => getStored('gradient_calc_history', []));

            const [allocL, setAllocL] = useState(() => localStorage.getItem('allocL') || '');
            const [allocPitch, setAllocPitch] = useState(() => localStorage.getItem('allocPitch') || '');
            const [allocCount, setAllocCount] = useState(() => localStorage.getItem('allocCount') || '');
            const [allocW, setAllocW] = useState(() => localStorage.getItem('allocW') || '');
            const [allocNo, setAllocNo] = useState(() => localStorage.getItem('allocNo') || '');
            const [allocSource, setAllocSource] = useState(() => localStorage.getItem('allocSource') || null);
            const [allocHistory, setAllocHistory] = useState(() => getStored('waritsuke_history', []));
            const [allocCalcInput, setAllocCalcInput] = useState('');
            const [allocCumulativeSum, setAllocCumulativeSum] = useState(() => toNum(localStorage.getItem('allocCumulativeSum') || 0));
            const [allocSumHistory, setAllocSumHistory] = useState(() => getStored('allocSumHistory', []));

            const [kanaPitch, setKanaPitch] = useState(() => localStorage.getItem('kanaPitch') || '');
            const [kanaCount, setKanaCount] = useState(() => localStorage.getItem('kanaCount') || '');
            const [kanaLength, setKanaLength] = useState(() => localStorage.getItem('kanaLength') || '');

            const [tfSize, setTfSize] = useState(() => localStorage.getItem('tfSize') || '600');
            const [tfTotalL, setTfTotalL] = useState(() => localStorage.getItem('tfTotalL') || '');

            const [totalHistory, setTotalHistory] = useState(() => getStored('totalHistory', []));
            const [calcInput, setCalcInput] = useState('');
            const [isClearModalOpen, setIsClearModalOpen] = useState(false);
            const [toastMsg, setToastMsg] = useState('');

            const showToast = useCallback((msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2000);
            }, []);

            const copyToClipboard = useCallback((text, label = "計算結果") => {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`${label}をクリップボードにコピーしました`);
                }).catch(() => {
                    showToast('コピーに失敗しました');
                });
            }, [showToast]);

            const materialResult = useMemo(() => {
                const total = toNum(totalDim), std = toNum(stdLength), over = toNum(overlap), effective = std - over;
                if (total > 0 && effective > 0) {
                    const pieces = Math.ceil(total / effective);
                    return { pieces, remainder: (pieces * effective) - total };
                }
                return { pieces: 0, remainder: 0 };
            }, [totalDim, stdLength, overlap]);

            const calcSummaryByName = useMemo(() => {
                const summary = {};
                history.forEach(item => {
                    const key = item.name || "（品名未指定）";
                    if (!summary[key]) summary[key] = { pieces: 0, totalDistance: 0 };
                    summary[key].pieces += (item.pieces || 0);
                    summary[key].totalDistance += toNum(item.total);
                });
                return summary;
            }, [history]);

            const allocCalculated = useMemo(() => {
                const L = toNum(allocW), W = toNum(allocPitch), N = toNum(allocCount);
                let pitchMode = { q: '-', qRem: '-' }, countMode = { w: '-', wRem: '-' };
                if (L > 0) {
                    if (W > 0) { const q = Math.ceil(L / W); pitchMode = { q, qRem: (q * W) - L }; }
                    if (N > 0) { const w = Math.ceil(L / N); countMode = { w, wRem: (w * N) - L }; }
                }
                return { pitchMode, countMode };
            }, [allocW, allocPitch, allocCount]);

            const allocTotals = useMemo(() => {
                return allocHistory.reduce((acc, item) => {
                    const qVal = parseInt(unformat(item.q)) || 0;
                    if (item.source === 'pitch') acc.pitchQ += qVal;
                    else if (item.source === 'count') acc.countQ += qVal;
                    return acc;
                }, { pitchQ: 0, countQ: 0 });
            }, [allocHistory]);

            const allocSummaryByMemo = useMemo(() => {
                const summary = {};
                allocHistory.forEach(item => {
                    const key = item.no || "（備考なし）";
                    if (!summary[key]) summary[key] = { pitch: 0, count: 0 };
                    const qVal = parseInt(unformat(item.q)) || 0;
                    if (item.source === 'pitch') summary[key].pitch += qVal;
                    else if (item.source === 'count') summary[key].count += qVal;
                });
                return summary;
            }, [allocHistory]);

            const kanamonoResults = useMemo(() => {
                const L = toNum(kanaLength), W = toNum(kanaPitch), N = toNum(kanaCount);
                let resQ = { val: '-', rem: '-' }, resW = { val: '-', rem: '-' };
                if (L > 0) {
                    if (W > 0) { const q = Math.floor(L / W) + 1; resQ = { val: q, rem: L - (W * (q - 1)) }; }
                    if (N > 1) { const w = Math.floor(L / (N - 1)); resW = { val: w, rem: L - (w * (N - 1)) }; }
                    else if (N === 1) resW = { val: 0, rem: L };
                }
                return { resQ, resW };
            }, [kanaLength, kanaPitch, kanaCount]);

            const kanamonoTableData = useMemo(() => {
                const { resQ, resW } = kanamonoResults, L = toNum(kanaLength), W = toNum(kanaPitch), N = toNum(kanaCount);
                const listQ = [], listN = [];
                if (L > 0 && W > 0 && resQ.val !== '-') { let pos = resQ.rem / 2; for (let i = 0; i < resQ.val; i++) { listQ.push(Math.round(pos)); pos += W; } }
                if (L > 0 && N > 0 && resW.val !== '-') { let pos = resW.rem / 2; for (let i = 0; i < N; i++) { listN.push(Math.round(pos)); pos += resW.val; } }
                const maxRows = Math.max(listQ.length, listN.length), rows = [];
                for (let i = 0; i < maxRows; i++) rows.push({ q: listQ[i], n: listN[i] });
                return rows;
            }, [kanaLength, kanaPitch, kanaCount, kanamonoResults]);

            const tfResults = useMemo(() => {
                const size = parseInt(tfSize) || 600; const L = toNum(tfTotalL); let yamaDim = 0, taniDim = 0, calcSize = size;
                if (size === 600) { yamaDim = 200; taniDim = 100; calcSize = 600; }
                else if (size === 500) { yamaDim = 250; taniDim = 125; calcSize = 500; }
                else if (size === 1000) { yamaDim = 500; taniDim = 250; calcSize = 500; }
                if (L <= 0) return { centerL: '', yamaDim, taniDim, taniZan: '', yamaZan: '', table: [], count: 0, roofTaniCount: '', roofYamaCount: '', L: 0 };
                const centerL = L / 2, taniZan = excelMod(centerL, yamaDim), yamaZan = excelMod(centerL - taniDim, yamaDim);
                let currentTani = taniZan, currentYama = yamaZan, table = [], count = 0;
                while (currentTani <= L || currentYama <= L) {
                    table.push({ tani: (currentTani <= L && currentTani >= 0) ? currentTani : null, yama: (currentYama <= L && currentYama >= 0) ? currentYama : null });
                    currentTani += size; currentYama += size; count++; if (count > 1000) break;
                }
                const roofTaniCount = Math.ceil((L + taniDim) / calcSize), roofYamaCount = Math.ceil(L / calcSize);
                return { centerL, yamaDim, taniDim, taniZan, yamaZan, table, count, roofTaniCount, roofYamaCount, L };
            }, [tfSize, tfTotalL]);

            const addValue = () => {
                const val = toNum(calcInput);
                if (val > 0) {
                    setTotalHistory([...totalHistory, { sum: cumulativeSum, total: totalDim }]);
                    setCumulativeSum(prev => prev + val);
                    setTotalDim(prev => (toNum(prev) + val).toString());
                    setCalcInput('');
                    setTimeout(() => calcInputRef.current?.focus(), 50);

                        if (num >= 1 && num <= APPS.length) {

                            setActiveApp(APPS[num - 1]);
                            return;

                        if (e.key.toLowerCase() === 's') {
                            e.preventDefault();
                            if (activeApp === 'calc') saveToHistoryManually();
                            else if (activeApp === 'alloc') saveAllocHistory();
                            return;
                        }
                        // ⌘P: Native print
                        if (e.key.toLowerCase() === 'p') {
                            return;
                        }
                    }

                                            </div>
                                            <div className="pt-2">
                                                <button onClick={() => setTfTotalL('')} className="mac-btn w-full text-xs">リセット</button>
                                            </div>
                                        </div>

                                        <div className="mac-card p-4 flex flex-col items-center justify-center bg-black/60 border border-zinc-800">
                                            <RoofProfileSVG size={tfSize} />
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="mac-card p-3.5 border-l-4 border-l-blue-500">
                                                <span className="text-xs text-blue-400 font-bold block mb-1">谷芯 端部基準 (タイト)</span>
                                                <div className="text-2xl font-mono font-bold text-white mb-1.5">{tfResults.taniZan !== '' ? format(tfResults.taniZan) : '-'} <span className="text-xs font-normal">mm</span></div>
                                                <div className="text-xs text-zinc-400 font-mono">屋根材谷芯: <span className="text-blue-400 font-bold">{tfResults.roofTaniCount || '-'}枚</span></div>
                                            </div>
                                            <div className="mac-card p-3.5 border-l-4 border-l-emerald-500">
                                                <span className="text-xs text-emerald-400 font-bold block mb-1">山芯 端部基準 (タイト)</span>
                                                <div className="text-2xl font-mono font-bold text-white mb-1.5">{tfResults.yamaZan !== '' ? format(tfResults.yamaZan) : '-'} <span className="text-xs font-normal">mm</span></div>
                                                <div className="text-xs text-zinc-400 font-mono">屋根材山芯: <span className="text-emerald-400 font-bold">{tfResults.roofYamaCount || '-'}枚</span></div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Table View */}
                                    <div className="col-span-7 mac-card flex flex-col overflow-hidden h-full">
                                        <div className="p-3 border-b border-zinc-800 flex justify-between items-center bg-zinc-900/60 shrink-0">
                                            <span className="text-xs font-bold text-zinc-300 uppercase tracking-wider">タイトフレーム割付位置 墨出し表</span>
                                            <span className="text-xs font-mono font-bold text-orange-400 bg-orange-500/10 px-2.5 py-1 rounded-full border border-orange-500/20">タイト合計: {tfResults.count} 本</span>
                                        </div>
                                        <div className="flex-1 overflow-y-auto">
                                            <table className="w-full text-center border-collapse">
                                                <thead className="sticky top-0 bg-zinc-900 border-b border-zinc-800 text-xs font-mono">
                                                    <tr>
                                                        <th className="py-2.5 px-3 text-blue-400 font-bold border-r border-zinc-800">谷芯 (mm)</th>
                                                        <th className="py-2.5 px-3 text-emerald-400 font-bold">山芯 (mm)</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="font-mono text-sm divide-y divide-zinc-800/60">
                                                    {tfResults.table.length === 0 ? (
                                                        <tr><td colSpan="2" className="py-20 text-zinc-600 italic font-bold">全長を入力してください</td></tr>
                                                    ) : (
                                                        tfResults.table.map((row, idx) => (
                                                            <tr key={idx} className="hover:bg-zinc-800/40">
                                                                <td className="py-2 border-r border-zinc-800 text-blue-400 font-semibold">{row.tani !== null ? format(row.tani) : '-'}</td>
                                                                <td className="py-2 text-emerald-400 font-semibold">{row.yama !== null ? format(row.yama) : '-'}</td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {}
                            {activeApp === 'kanamono' && (
                                <div className="grid grid-cols-12 gap-5 h-full overflow-hidden text-sm">
                                    <div className="col-span-5 flex flex-col gap-4 overflow-y-auto pr-1">
                                        <div className="mac-card p-4 space-y-3">
                                            <div className="text-xs font-bold uppercase tracking-wider text-zinc-400">金物 パラメーター</div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="text-xs text-blue-400 font-semibold mb-1 block">ピッチ (働き)</label>
                                                    <input ref={kanamonoPitchRef} type="text" value={format(kanaPitch)} onFocus={handleFocus} onChange={(e) => setKanaPitch(unformat(e.target.value))} onKeyDown={(e) => handleEnterKey(e, kanamonoLengthRef)} className="mac-input w-full text-blue-400" placeholder="例: 450" />
                                                </div>
                                                <div>
                                                    <label className="text-xs text-emerald-400 font-semibold mb-1 block">指定本数</label>
                                                    <input ref={kanamonoCountRef} type="text" value={format(kanaCount)} onFocus={handleFocus} onChange={(e) => setKanaCount(unformat(e.target.value))} onKeyDown={(e) => handleEnterKey(e, kanamonoLengthRef)} className="mac-input w-full text-emerald-400" placeholder="例: 10" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs text-zinc-400 font-semibold mb-1 block">全幅 (mm)</label>
                                                <input ref={kanamonoLengthRef} type="text" value={format(kanaLength)} onFocus={handleFocus} onChange={(e) => setKanaLength(unformat(e.target.value))} className="mac-input w-full !text-lg font-bold" placeholder="取り付け全長" />
                                            </div>
                                            <button onClick={() => { setKanaPitch(''); setKanaCount(''); setKanaLength(''); }} className="mac-btn w-full text-xs">リセット</button>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="mac-card p-3.5 border-l-4 border-l-blue-500 font-mono">
                                                <span className="text-xs text-blue-400 font-bold block mb-1 font-sans">ピッチ基準 結果</span>
                                                <div className="text-2xl font-bold text-blue-400">{kanamonoResults.resQ.val} <span className="text-xs font-normal text-zinc-400">本</span></div>
                                                <div className="text-xs text-zinc-400 mt-1">両端余り: {format(kanamonoResults.resQ.rem)} mm</div>
                                            </div>
                                            <div className="mac-card p-3.5 border-l-4 border-l-emerald-500 font-mono">
                                                <span className="text-xs text-emerald-400 font-bold block mb-1 font-sans">本数基準 結果</span>
                                                <div className="text-2xl font-bold text-emerald-400">{format(kanamonoResults.resW.val)} <span className="text-xs font-normal text-zinc-400">mmピッチ</span></div>
                                                <div className="text-xs text-zinc-400 mt-1">両端余り: {format(kanamonoResults.resW.rem)} mm</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Table View */}
                                    <div className="col-span-7 mac-card flex flex-col overflow-hidden h-full">
                                        <div className="p-3 border-b border-zinc-800 flex justify-between items-center bg-zinc-900/60 shrink-0">
                                            <span className="text-xs font-bold text-zinc-300 uppercase tracking-wider">割付 墨出し位置一覧</span>
                                            <span className="text-xs font-mono font-bold text-orange-400 bg-orange-500/10 px-2.5 py-1 rounded-full border border-orange-500/20">W: {format(kanaLength)} mm</span>
                                        </div>
                                        <div className="flex-1 overflow-y-auto">
                                            <table className="w-full text-center border-collapse">
                                                <thead className="sticky top-0 bg-zinc-900 border-b border-zinc-800 text-xs font-mono">
                                                    <tr>
                                                        <th className="py-2.5 px-3 text-blue-400 font-bold border-r border-zinc-800">ピッチ基準位置 (mm)</th>
                                                        <th className="py-2.5 px-3 text-emerald-400 font-bold">本数基準位置 (mm)</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="font-mono text-sm divide-y divide-zinc-800/60">
                                                    {kanamonoTableData.length === 0 ? (
                                                        <tr><td colSpan="2" className="py-20 text-zinc-600 italic font-bold">全幅とピッチまたは本数を入力してください</td></tr>
                                                    ) : (
                                                        kanamonoTableData.map((row, idx) => (
                                                            <tr key={idx} className="hover:bg-zinc-800/40">
                                                                <td className="py-2 border-r border-zinc-800 text-blue-400 font-semibold">{row.q !== undefined ? format(row.q) : '-'}</td>
                                                                <td className="py-2 text-emerald-400 font-semibold">{row.n !== undefined ? format(row.n) : '-'}</td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Clear Confirmation Modal */}
                    {isClearModalOpen && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm px-4">
                            <div className="mac-card p-6 w-80 text-center space-y-4 shadow-2xl border border-white/20 animate-fade-in">
                                <h3 className="text-sm font-bold text-white">履歴の全削除</h3>
                                <p className="text-xs text-zinc-400">すべての計算履歴を消去します。<br/>この操作は元に戻せません。</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setIsClearModalOpen(false)} className="flex-1 mac-btn text-xs">キャンセル</button>
                                    <button onClick={() => {
                                        if (activeApp === 'alloc') { setAllocHistory([]); localStorage.removeItem('waritsuke_history'); }
                                        else if (activeApp === 'calc') { setHistory([]); localStorage.removeItem('gradient_calc_history'); }
                                        setIsClearModalOpen(false);
                                        showToast('履歴を削除しました');
                                    }} className="flex-1 mac-btn mac-btn-red text-xs">削除する</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
